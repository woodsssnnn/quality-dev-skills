name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  link-check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: 'yes'
          base-branch: 'main'

  json-validation:
    name: JSON Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          for f in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done

  shell-check:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          for f in $(find scripts -name "*.sh"); do
            echo "Checking $f"
            shellcheck "$f"
          done

  banned-terms:
    name: Banned Terms Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for banned source-project terms
        run: bash scripts/check-banned-terms.sh

  python-syntax:
    name: Python Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files
        run: |
          errors=0
          for f in $(find . -name "*.py" -not -path "./node_modules/*" -not -path "./.git/*"); do
            echo "Checking $f"
            python3 -m py_compile "$f" || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "❌ $errors Python file(s) failed syntax check"
            exit 1
          fi
          echo "✅ All Python files pass syntax check"

  unit-tests:
    name: Unit Tests
    needs: python-syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r skills/quality-gate-workflow/scripts/requirements-dev.txt
      - name: Run unit tests
        run: |
          if [ -d "skills/quality-gate-workflow/scripts/tests" ]; then
            python -m pytest skills/quality-gate-workflow/scripts/tests/ -v --tb=short
          else
            echo "No test directory found, skipping"
          fi

  smoke-tests:
    name: Smoke Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gate-enforcer smoke test
        run: |
          if [ -f "skills/quality-gate-workflow/scripts/gate-enforcer.py" ]; then
            python skills/quality-gate-workflow/scripts/gate-enforcer.py --help
            python skills/quality-gate-workflow/scripts/gate-enforcer.py status 2>/dev/null || true
            echo "✅ gate-enforcer.py smoke test passed"
          else
            echo "gate-enforcer.py not found, skipping"
          fi

  powershell-check:
    name: PowerShell Syntax Check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path scripts -Filter "*.ps1" -Recurse
          $errors = 0
          foreach ($f in $files) {
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -eq 0) {
              Write-Host "  PASS $($f.Name)"
            } else {
              Write-Host "  FAIL $($f.Name): $($parseErrors[0].Message)"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }
          Write-Host "✅ All PowerShell scripts pass syntax check"

  domain-packs:
    name: Domain Packs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all domain packs
        run: |
          if [ -d domains ]; then
            for d in domains/*/; do
              echo "Validating $d"
              python scripts/validate-domain-pack.py "$d"
            done
          else
            echo "no domains/ directory, skipping"
          fi

  governance-tests:
    name: Governance Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run governance self-tests
        run: |
          node governance/tests/run-tests.js
          node governance/hooks/integrity-check.js --self-test

  prd-parse-smoke:
    name: PRD Parse Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HTML backend smoke test
        run: |
          python -m py_compile skills/prd-parse/scripts/prd_parse.py
          mkdir -p /tmp/prd-smoke
          printf '<!doctype html><html><head><meta charset="utf-8"><title>t</title></head><body><h1>标题</h1><table><tr><td>a</td></tr></table></body></html>' > /tmp/prd-smoke/doc.html
          python skills/prd-parse/scripts/prd_parse.py /tmp/prd-smoke
          grep -q '| a |' /tmp/prd-smoke/parsed/doc.md

  manifest-check:
    name: Manifest Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate manifest
        run: python scripts/generate-manifest.py --validate
